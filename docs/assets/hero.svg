<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Warden</title>
  <desc id="d">AI agents obey what they read. Warden stops the orders they shouldn't.</desc>
  <defs>
    <style>
      .h { font-family: "Archivo Black", "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; fill: #000; }
      .b { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .m { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hl { transform-box: fill-box; transform-origin: left center; animation: mark 6s cubic-bezier(.6,0,.2,1) infinite; }
      .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 6s cubic-bezier(.2,1.6,.4,1) infinite; }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes mark { 0%, 12% { transform: scaleX(0); } 30%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
      @keyframes stamp { 0%, 34% { transform: rotate(-8deg) scale(1.8); opacity: 0; } 42%, 92% { transform: rotate(-8deg) scale(1); opacity: 1; } 100% { transform: rotate(-8deg) scale(1); opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .hl, .stamp, .caret { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#F2F2EF"/>

  <!-- masthead -->
  <rect width="1200" height="64" fill="#FFFFFF"/>
  <rect y="62" width="1200" height="2" fill="#000"/>
  <rect x="48" y="17" width="30" height="30" fill="#E5341B" stroke="#000" stroke-width="2"/>
  <text x="63" y="38.5" text-anchor="middle" class="h" style="font-size:16px">W</text>
  <text x="90" y="41" class="h" style="font-size:24px; letter-spacing:-.5px">Warden</text>
  <g class="b" style="font-size:15px; fill:#555">
    <text x="470" y="38" style="fill:#000; font-weight:700">Home</text>
    <text x="536" y="38">Demo</text>
    <text x="598" y="38">Attack lab</text>
    <text x="688" y="38">Results</text>
    <text x="760" y="38">Data</text>
    <text x="816" y="38">Tools</text>
    <text x="874" y="38">Audit</text>
  </g>
  <rect x="468" y="60" width="44" height="4" fill="#000"/>
  <rect x="1032" y="18" width="120" height="32" fill="#000"/>
  <rect x="1028" y="14" width="120" height="32" fill="#FFD600" stroke="#000" stroke-width="2"/>
  <text x="1088" y="35" text-anchor="middle" class="b" style="font-size:13px; font-weight:700">Run the demo</text>

  <!-- headline -->
  <g class="h" style="font-size:52px; letter-spacing:-2px">
    <text x="48" y="150">AI agents obey what they read.</text>
    <text x="48" y="212">Warden stops the orders they</text>
    <rect class="hl" x="44" y="236" width="258" height="44" fill="#FFD600"/>
    <text x="48" y="274">shouldn’t.</text>
  </g>

  <text x="48" y="328" class="b" style="font-size:19px; fill:#333">A firewall between an AI agent and its tools. It traces where every address,</text>
  <text x="48" y="356" class="b" style="font-size:19px; fill:#333">link and file came from, and blocks anything planted by an email, page or document.</text>
  <text x="48" y="396" class="m" style="font-size:13px; fill:#555; letter-spacing:1.5px">$ ./run.sh<tspan class="caret">▍</tspan></text>

  <!-- stamp -->
  <g class="stamp">
    <rect x="958" y="186" width="200" height="66" fill="#000"/>
    <rect x="952" y="180" width="200" height="66" fill="#E5341B" stroke="#000" stroke-width="2"/>
    <text x="1052" y="224" text-anchor="middle" class="h" style="font-size:30px; fill:#fff; letter-spacing:2px">BLOCKED</text>
    <text x="1052" y="276" text-anchor="middle" class="m" style="font-size:12px; fill:#555">email:e4 · line 3</text>
  </g>
</svg>
