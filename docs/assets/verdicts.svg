<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t d">
  <title id="t">Three verdicts</title>
  <desc id="d">Allow: the values trace back to you or the call is low-risk. Ask: Warden isn't sure, so a person decides. Block: the call was planted, leaks a secret, or breaks policy.</desc>
  <defs>
    <style>
      .h { font-family: "Archivo Black", "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; fill: #000; }
      .b { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000; }
      .m { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #000; }
      @keyframes p0 { 0%, 5.00% { transform: translate(0,0); } 7.00%, 15.00% { transform: translate(6px,6px); } 17.00%, 100% { transform: translate(0,0); } }
      .p0 { animation: p0 6.0s infinite; transform: translate(0,0); }
      @keyframes p1 { 0%, 31.67% { transform: translate(0,0); } 33.67%, 41.67% { transform: translate(6px,6px); } 43.67%, 100% { transform: translate(0,0); } }
      .p1 { animation: p1 6.0s infinite; transform: translate(0,0); }
      @keyframes p2 { 0%, 58.33% { transform: translate(0,0); } 60.33%, 68.33% { transform: translate(6px,6px); } 70.33%, 100% { transform: translate(0,0); } }
      .p2 { animation: p2 6.0s infinite; transform: translate(0,0); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="150" fill="#F2F2EF"/>
<rect x="39" y="32" width="360" height="104" fill="#000"/>
  <g class="p0"><rect x="33" y="26" width="360" height="104" fill="#0E8A5F" stroke="#000" stroke-width="2"/><text x="57" y="80" class="h" style="font-size:34px; letter-spacing:2px; fill:#fff">ALLOW</text><text x="57" y="108" class="b" style="font-size:15px; font-weight:600; fill:#fff">Traces back to you, or low-risk</text></g>
  <rect x="423" y="32" width="360" height="104" fill="#000"/>
  <g class="p1"><rect x="417" y="26" width="360" height="104" fill="#FFD600" stroke="#000" stroke-width="2"/><text x="441" y="80" class="h" style="font-size:34px; letter-spacing:2px; fill:#000">ASK</text><text x="441" y="108" class="b" style="font-size:15px; font-weight:600; fill:#000">Not sure, so a person decides</text></g>
  <rect x="807" y="32" width="360" height="104" fill="#000"/>
  <g class="p2"><rect x="801" y="26" width="360" height="104" fill="#E5341B" stroke="#000" stroke-width="2"/><text x="825" y="80" class="h" style="font-size:34px; letter-spacing:2px; fill:#fff">BLOCK</text><text x="825" y="108" class="b" style="font-size:15px; font-weight:600; fill:#fff">Planted, leaking, or off-policy</text></g>
</svg>
